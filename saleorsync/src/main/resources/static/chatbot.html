<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saleor Product Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173042;
      --muted: #6a7e89;
      --line: #d9e4e8;
      --panel: #ffffff;
      --soft: #edf7f6;
      --accent: #11858a;
      --accent-dark: #0b666b;
      --user: #123d52;
      --danger: #a23b3b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(41, 174, 169, .16), transparent 30%),
        radial-gradient(circle at 88% 90%, rgba(32, 83, 107, .13), transparent 34%),
        #eef3f5;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .chat-shell {
      width: min(920px, 100%);
      height: min(780px, calc(100vh - 48px));
      min-height: 560px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid rgba(23, 48, 66, .12);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(30, 57, 70, .16);
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      color: white;
      background: linear-gradient(120deg, #10384d, #107f83);
    }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      background: rgba(255, 255, 255, .14);
      font-size: 23px;
    }

    h1 { margin: 0; font-size: 19px; letter-spacing: -.2px; }
    header p { margin: 4px 0 0; color: #d6efee; font-size: 13px; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #e2f5f4;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #70dec3;
      box-shadow: 0 0 0 4px rgba(112, 222, 195, .14);
    }

    #messages {
      overflow-y: auto;
      padding: 26px clamp(18px, 4vw, 38px);
      scroll-behavior: smooth;
    }

    .welcome { max-width: 620px; margin: 0 auto 24px; text-align: center; }
    .welcome h2 { margin: 0 0 8px; font-size: 24px; }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.55; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .suggestion {
      border: 1px solid #cce0e1;
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--accent-dark);
      background: var(--soft);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .suggestion:hover { border-color: var(--accent); background: #e1f2f0; }

    .message { display: flex; margin: 15px 0; }
    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: min(680px, 86%);
      padding: 12px 15px;
      border-radius: 17px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 14px;
    }

    .assistant .bubble {
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
      background: #f7fafb;
    }

    .user .bubble {
      color: white;
      border-bottom-right-radius: 5px;
      background: var(--user);
    }

    .error .bubble { color: var(--danger); border-color: #efcaca; background: #fff5f5; }

    .assistant-line { min-height: 1.25em; }
    .assistant-line + .assistant-line { margin-top: 3px; }
    .product-image {
      display: block;
      width: min(320px, 100%);
      margin: 10px 0 4px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }
    .product-image img { display: block; width: 100%; height: auto; }
    .product-image span { display: block; padding: 7px 10px; color: var(--muted); font-size: 11px; }

    .typing { display: inline-flex; gap: 5px; align-items: center; min-height: 22px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #7f969f; animation: pulse 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .16s; }
    .typing span:nth-child(3) { animation-delay: .32s; }
    @keyframes pulse { 0%, 70%, 100% { opacity: .3; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }

    form {
      padding: 16px 20px 18px;
      border-top: 1px solid var(--line);
      background: #fbfcfd;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 780px;
      margin: auto;
      padding: 8px 8px 8px 15px;
      border: 1px solid #bdcdd3;
      border-radius: 18px;
      background: white;
      box-shadow: 0 5px 18px rgba(25, 57, 71, .07);
    }

    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 130px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 10px 0 7px;
      color: var(--ink);
      background: transparent;
      font: inherit;
      line-height: 1.4;
    }

    #send {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 13px;
      color: white;
      background: var(--accent);
      cursor: pointer;
      font-size: 19px;
    }

    #send:hover { background: var(--accent-dark); }
    #send:disabled { cursor: not-allowed; opacity: .45; }
    .hint { margin: 8px auto 0; text-align: center; color: var(--muted); font-size: 11px; }

    @media (max-width: 600px) {
      body { padding: 0; }
      .chat-shell { height: 100vh; min-height: 100vh; border: 0; border-radius: 0; }
      header { padding: 15px 16px; }
      .status span:last-child { display: none; }
      form { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="chat-shell">
    <header>
      <div class="mark" aria-hidden="true">✦</div>
      <div>
        <h1>Saleor Product Assistant</h1>
        <p>Products, variants, product types and attributes</p>
      </div>
      <div class="status"><span class="status-dot"></span><span>Ready</span></div>
    </header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>How can I help?</h2>
        <p>Ask a question about the live Saleor catalogue. The assistant can use the read-only Product MCP tools when it needs current data.</p>
        <div class="suggestions">
          <button class="suggestion" type="button">List the first 10 products</button>
          <button class="suggestion" type="button">Find products matching wine</button>
          <button class="suggestion" type="button">Show the first 10 product types</button>
          <button class="suggestion" type="button">List the first 10 attributes</button>
        </div>
      </div>
    </section>

    <form id="chat-form">
      <div class="composer">
        <textarea id="message" rows="1" maxlength="4000" placeholder="Ask about the product catalogue…" aria-label="Message" required></textarea>
        <button id="send" type="submit" title="Send message" aria-label="Send message">➤</button>
      </div>
      <div class="hint">Press Enter to send · Shift+Enter for a new line</div>
    </form>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const endpoint = new URL("./ai/chat", window.location.href);
    const storageKey = "saleor-product-chat-history-v1";
    const maxHistoryMessages = 20;
    let conversation = loadConversation();

    function loadConversation() {
      try {
        const value = JSON.parse(sessionStorage.getItem(storageKey) || "[]");
        if (!Array.isArray(value)) return [];
        const loaded = value.filter(item => item && (item.role === "user" || item.role === "assistant")
            && typeof item.content === "string" && item.content.trim())
          .slice(-maxHistoryMessages);
        if (loaded.length && loaded[0].role === "assistant") loaded.shift();
        return loaded;
      } catch (_) {
        return [];
      }
    }

    function saveConversation() {
      conversation = conversation.slice(-maxHistoryMessages);
      if (conversation.length && conversation[0].role === "assistant") conversation.shift();
      sessionStorage.setItem(storageKey, JSON.stringify(conversation));
    }

    function addMessage(role, text, extraClass = "") {
      const row = document.createElement("div");
      row.className = `message ${role} ${extraClass}`.trim();
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "assistant" && !extraClass.includes("error")) {
        renderAssistantContent(bubble, text);
      } else {
        bubble.textContent = text;
      }
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return row;
    }

    function appendFormattedText(parent, text) {
      let position = 0;
      const bold = /\*\*(.+?)\*\*/g;
      let match;
      while ((match = bold.exec(text)) !== null) {
        parent.append(document.createTextNode(text.slice(position, match.index)));
        const strong = document.createElement("strong");
        strong.textContent = match[1];
        parent.append(strong);
        position = match.index + match[0].length;
      }
      parent.append(document.createTextNode(text.slice(position)));
    }

    function safeThumbnailUrl(text) {
      const matches = text.match(/https?:\/\/[^\s)\]]+/g) || [];
      for (const value of matches) {
        try {
          const url = new URL(value);
          if ((url.protocol === "https:" || url.protocol === "http:")
              && url.pathname.toLowerCase().includes("/thumbnail/")) return url.href;
        } catch (_) { /* Ignore malformed URLs. */ }
      }
      return null;
    }

    function renderAssistantContent(parent, text) {
      const renderedImages = new Set();
      for (const originalLine of String(text).split("\n")) {
        const thumbnail = safeThumbnailUrl(originalLine);
        if (thumbnail && !renderedImages.has(thumbnail)) {
          renderedImages.add(thumbnail);
          const labelMatch = originalLine.match(/!\[([^\]]*)\]/);
          const link = document.createElement("a");
          link.className = "product-image";
          link.href = thumbnail;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          const image = document.createElement("img");
          image.src = thumbnail;
          image.alt = labelMatch && labelMatch[1] ? labelMatch[1] : "Product thumbnail";
          image.loading = "lazy";
          const caption = document.createElement("span");
          caption.textContent = image.alt;
          link.append(image, caption);
          image.addEventListener("error", () => {
            image.remove();
            caption.textContent = "Thumbnail unavailable — open image URL";
          });
          parent.append(link);
          continue;
        }
        const line = document.createElement("div");
        line.className = "assistant-line";
        appendFormattedText(line, originalLine);
        parent.append(line);
      }
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "message assistant";
      const bubble = document.createElement("div");
      bubble.className = "bubble typing";
      bubble.setAttribute("aria-label", "Assistant is working");
      bubble.innerHTML = "<span></span><span></span><span></span>";
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return row;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
    }

    async function submitMessage(text) {
      const value = text.trim();
      if (!value || send.disabled) return;
      welcome.hidden = true;
      addMessage("user", value);
      conversation.push({ role: "user", content: value });
      saveConversation();
      input.value = "";
      resizeInput();
      send.disabled = true;
      input.disabled = true;
      const typing = addTyping();

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ messages: conversation.slice(-maxHistoryMessages) })
        });
        const raw = await response.text();
        let data;
        try { data = raw ? JSON.parse(raw) : {}; }
        catch (_) { data = {}; }
        if (!response.ok) {
          throw new Error(data.message || data.error || raw || `Request failed (${response.status})`);
        }
        const reply = data.reply || "The assistant returned no reply.";
        addMessage("assistant", reply);
        conversation.push({ role: "assistant", content: reply });
        saveConversation();
      } catch (error) {
        addMessage("assistant", `Unable to complete the request: ${error.message}`, "error");
      } finally {
        typing.remove();
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      submitMessage(input.value);
    });

    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".suggestion").forEach(button => {
      button.addEventListener("click", () => submitMessage(button.textContent));
    });

    if (conversation.length) {
      welcome.hidden = true;
      conversation.forEach(item => addMessage(item.role, item.content));
    }
    input.focus();
  </script>
</body>
</html>
