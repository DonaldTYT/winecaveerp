# your Saleor GraphQL endpoint
saleor.graphql-url=http://localhost:8000/graphql/

# Optional local credentials file (excluded from Git).
spring.config.import=optional:classpath:config/application-secrets.properties

# Read-only Product REST/MCP facade. Keep secrets in environment variables.
saleor.product-api.graphql-url=${SALEOR_PRODUCT_API_URL:http://192.168.19.212:8000/graphql/}
saleor.product-api.token=${SALEOR_PRODUCT_MCP_TOKEN:}
# Optional caller authentication for /api/catalog/** and /mcp.
saleor.product-api.client-api-key=${PRODUCT_API_CLIENT_KEY:}
# Comma-separated exact browser origins. Requests without Origin are accepted.
saleor.product-api.allowed-origins=${PRODUCT_API_ALLOWED_ORIGINS:}
# Enforced customer catalogue channel. Caller-supplied channel values are ignored.
saleor.product-api.channel=hk
saleor.product-api.connect-timeout-ms=5000
saleor.product-api.read-timeout-ms=20000

# (these still work when running as a JAR in dev; they are ignored by external Tomcat)
server.port=8081
server.servlet.context-path=/sync

# GraphQL HTTP endpoint (default is /graphql)
spring.graphql.path=/graphql
spring.graphql.graphiql.path=/graphiql
# Built-in GraphiQL UI (handy for testing at /graphiql)
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.cdn.enabled=true   # load GraphiQL assets from CDN
# For Swagger UI (springdoc)
springdoc.api-docs.path=/v3/api-docs
# Boot 2.7: UI at /swagger-ui.html

sync.enabled=false
dbtest.enabled=false


